<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pressman Parent Center</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E %3Crect width='64' height='64' rx='14' fill='%23FDF6EB'/%3E %3Cg fill='none' stroke-width='5'%3E %3Ccircle cx='21' cy='21' r='8.6' stroke='%23A93FE0'/%3E %3Ccircle cx='43' cy='21' r='8.6' stroke='%232E6FE8'/%3E %3Ccircle cx='21' cy='43' r='8.6' stroke='%23E2B800'/%3E %3Ccircle cx='43' cy='43' r='8.6' stroke='%23F02F84'/%3E %3C/g%3E %3C/svg%3E">
<meta name="theme-color" content="#FDF6EB">
<style>html,body{margin:0;height:100%;background:#FDF6EB}iframe{display:block;border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="app" title="Pressman Parent Center" allow="clipboard-write"></iframe>
<script>
var EXEC = 'https://script.google.com/macros/s/AKfycbzWUDok9HsK7uRo90mfzjWAd0WuWfZZzQLbcGVrSwn6hxi47NzJtz6mSOkdTe69zQCY/exec';
var app = document.getElementById('app');
function load() { var h = location.hash.replace(/[^A-Za-z0-9_-]/g, ''); app.src = EXEC + (h ? '#' + h : ''); }
load();
window.addEventListener('hashchange', load);
window.addEventListener('message', function (e) {
var host = ''; try { host = new URL(e.origin).hostname; } catch (err) {}
if (!/(^|[.])googleusercontent[.]com$/.test(host)) return;
var p = e.data && e.data.pbtsPage; if (typeof p !== 'string' || !/^[A-Za-z0-9_-]{0,40}$/.test(p)) return;
var want = p ? '#' + p : '';
if (location.hash !== want) history.replaceState(null, '', location.pathname + location.search + want);
});
</script>
</body>
</html>
